name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.12
  GOEXPERIMENT: jsonv2

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify tag version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Releasing version: $VERSION"

      - name: Build all modules
        run: |
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Build $mod"
            (cd $mod && go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Test $mod"
            (cd $mod && go test -v -race ./...)
            echo "::endgroup::"
          done

      - name: Lint all modules
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::govulncheck $mod"
            (cd $mod && govulncheck ./...)
            echo "::endgroup::"
          done

      - name: Run benchmarks
        run: |
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            (cd $mod && go test -run=^$ -bench=. -benchmem ./...)
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
