name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Verify tag version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Releasing version: $VERSION"

      - name: Build all modules
        run: |
          for mod in . enum escape testhelpers sort cmdguard table integration examples; do
            echo "::group::Build $mod"
            (cd $mod && go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          for mod in . enum escape testhelpers sort cmdguard table integration examples; do
            echo "::group::Test $mod"
            (cd $mod && go test -v -race ./...)
            echo "::endgroup::"
          done

      - name: Lint all modules
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          for mod in . enum escape testhelpers sort cmdguard table integration examples; do
            echo "::group::Lint $mod"
            if [ -f "$mod/.golangci.yml" ] || [ -f "$mod/.golangci.yaml" ]; then
              (cd $mod && golangci-lint run ./...)
            else
              (cd $mod && golangci-lint run ./... --config=../.golangci.yml)
            fi
            echo "::endgroup::"
          done

      - name: Run benchmarks
        run: |
          for mod in . enum escape testhelpers sort cmdguard table integration examples; do
            (cd $mod && go test -run=^$ -bench=. -benchmem ./...)
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
