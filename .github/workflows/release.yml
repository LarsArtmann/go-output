name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27"
  GOTOOLCHAIN: go1.27.2
  GOLANGCI_LINT_VERSION: v2.14.0
  GOEXPERIMENT: jsonv2
  # All 19 modules (root "." + 18 sub-modules) — keep in sync with scripts/pre-tag-check.sh
  ALL_MODULES: . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples
  # Submodules that get release tags (excludes test-only: examples, integration)
  TAGGED_SUBMODULES: bdd d2 daghtml delimited escape graph markdown markup nom plantuml serialization table testhelpers testhelpers/graphtest tree tui

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify tag version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Releasing version: $VERSION"

      - name: Build all modules
        run: |
          read -ra MODULES <<< "$ALL_MODULES"
          for mod in "${MODULES[@]}"; do
            echo "::group::Build $mod"
            (cd "$mod" && go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          read -ra MODULES <<< "$ALL_MODULES"
          for mod in "${MODULES[@]}"; do
            echo "::group::Test $mod"
            (cd "$mod" && go test -v -race -timeout 120s ./...)
            echo "::endgroup::"
          done

      - name: Lint all modules
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          read -ra MODULES <<< "$ALL_MODULES"
          for mod in "${MODULES[@]}"; do
            echo "::group::govulncheck $mod"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done

      - name: Run benchmarks
        run: |
          read -ra MODULES <<< "$ALL_MODULES"
          for mod in "${MODULES[@]}"; do
            (cd "$mod" && go test -run=^$ -bench=. -benchmem ./...)
          done

      # The GitHub Release is created BEFORE the submodule tags on purpose: a
      # failure in the tag step (git identity, permissions, network) must never
      # suppress the Release or the website redeploy. That suppression is what
      # hid the v0.37.0/v0.38.0 releases and cost v0.38.7 a manual recovery.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Safety net only: scripts/tag-release.sh pushes the full 17-tag family, so
      # this usually finds every tag already on origin. Non-fatal (continue-on-
      # error) for the same reason the Release runs first — and confirm the tags
      # afterwards per docs/RELEASE_FAILURE_MODES.md rather than trusting a green
      # job.
      - name: Create and push submodule tags
        continue-on-error: true
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Only process root-level version tags (vX.Y.Z), not submodule tags (module/vX.Y.Z)
          if [[ "$TAG" == */* ]]; then
            echo "Submodule tag ($TAG) — skipping auto-tagging"
            exit 0
          fi

          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse HEAD)

          # Annotated tags need a tagger identity and a fresh runner has none
          # configured, so `git tag -a` dies with "empty ident name" (exit 128)
          # and silently skips everything after it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # actions/checkout fetches only the one tag being deployed, so check
          # tag existence against ORIGIN (not the local refs) before creating
          # anything — a duplicate push of a differently hashed annotated tag
          # object is rejected (exit 128).
          created=0
          for mod in $TAGGED_SUBMODULES; do
            SUBTAG="${mod}/v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${SUBTAG}" >/dev/null 2>&1; then
              echo "::warning::Tag ${SUBTAG} already exists on origin, skipping"
              continue
            fi
            git tag -a "${SUBTAG}" -m "${TAG}" "${COMMIT}"
            echo "Created annotated tag ${SUBTAG} at ${COMMIT}"
            git push origin "refs/tags/${SUBTAG}"
            created=$((created + 1))
          done

          echo "Created and pushed ${created} submodule tag(s)"

  # Redeploy the website on every root version tag so the live docs,
  # changelog pages, and examples never drift behind a released version.
  # Called via workflow_call; the deploy job inside website.yml runs because
  # the event name is workflow_call (no branch/tag condition needed here).
  deploy-website:
    name: Redeploy Website
    needs: release
    uses: ./.github/workflows/website.yml
    secrets: inherit
    permissions:
      contents: read
