name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.12
  GOEXPERIMENT: jsonv2
  # All 19 modules (root "." + 18 sub-modules) — keep in sync with scripts/pre-tag-check.sh
  ALL_MODULES: . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples
  # Submodules that get release tags (excludes test-only: examples, integration)
  TAGGED_SUBMODULES: bdd d2 daghtml delimited escape graph markdown markup nom plantuml serialization table testhelpers testhelpers/graphtest tree tui

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify tag version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "Releasing version: $VERSION"

      - name: Build all modules
        run: |
          for mod in $ALL_MODULES; do
            echo "::group::Build $mod"
            (cd $mod && go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          for mod in $ALL_MODULES; do
            echo "::group::Test $mod"
            (cd $mod && go test -v -race -timeout 120s ./...)
            echo "::endgroup::"
          done

      - name: Lint all modules
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in $ALL_MODULES; do
            echo "::group::govulncheck $mod"
            (cd $mod && govulncheck ./...)
            echo "::endgroup::"
          done

      - name: Run benchmarks
        run: |
          for mod in $ALL_MODULES; do
            (cd $mod && go test -run=^$ -bench=. -benchmem ./...)
          done

      - name: Create and push submodule tags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Only process root-level version tags (vX.Y.Z), not submodule tags (module/vX.Y.Z)
          if [[ "$TAG" == */* ]]; then
            echo "Submodule tag ($TAG) — skipping auto-tagging"
            exit 0
          fi

          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse HEAD)

          created=0
          for mod in $TAGGED_SUBMODULES; do
            SUBTAG="${mod}/v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${SUBTAG}" >/dev/null; then
              echo "::warning::Tag ${SUBTAG} already exists, skipping"
            else
              git tag -a "${SUBTAG}" -m "${TAG}" "${COMMIT}"
              echo "Created annotated tag ${SUBTAG} at ${COMMIT}"
              created=$((created + 1))
            fi
          done

          if [ "$created" -gt 0 ]; then
            echo "Pushing $created new submodule tags…"
            git push origin "refs/tags/*"
          else
            echo "All submodule tags already exist — nothing to push"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Redeploy the website on every root version tag so the live docs,
  # changelog pages, and examples never drift behind a released version.
  # Called via workflow_call; the deploy job inside website.yml runs because
  # the event name is workflow_call (no branch/tag condition needed here).
  deploy-website:
    name: Redeploy Website
    needs: release
    uses: ./.github/workflows/website.yml
    secrets: inherit
    permissions:
      contents: read
