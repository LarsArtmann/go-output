name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.27"
  GOTOOLCHAIN: go1.27.2
  GOLANGCI_LINT_VERSION: v2.14.0
  GOEXPERIMENT: jsonv2

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all modules
        run: |
          for mod in . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Build $mod"
            (cd "$mod" && go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          for mod in . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Test $mod"
            (cd "$mod" && go test -v -race -timeout 120s -coverprofile=cover.out ./...)
            echo "::endgroup::"
          done

      - name: Check coverage thresholds
        run: |
          MIN_COVERAGE=80
          # Test-support modules stay exempt: examples are self-contained docs,
          # bdd is Ginkgo infrastructure, testhelpers/graphtest holds shared
          # fixtures — consumers' tests exercise them, in-module go test cannot.
          NO_THRESHOLD=" examples bdd testhelpers/graphtest "
          FAILED=""
          for mod in . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            if [ -f "$mod/cover.out" ]; then
              COV=$(cd $mod && go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
              echo "$mod: ${COV}% coverage"
              if [[ "$NO_THRESHOLD" != *" $mod "* ]] && [ "$(echo "$COV < $MIN_COVERAGE" | bc -l)" = "1" ]; then
                FAILED="$FAILED $mod(${COV}%)"
              fi
              rm -f "$mod/cover.out"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Coverage below ${MIN_COVERAGE}% in:$FAILED"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          for mod in . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Mod tidy $mod"
            cp "$mod/go.mod" "$mod/go.mod.bak"
            if [ -f "$mod/go.sum" ]; then
              cp "$mod/go.sum" "$mod/go.sum.bak"
            fi
            (cd "$mod" && go mod tidy)
            if ! diff -q "$mod/go.mod" "$mod/go.mod.bak" >/dev/null; then
              echo "::error::go.mod is not tidy in $mod"
              rm -f "$mod/go.mod.bak" "$mod/go.sum.bak"
              exit 1
            fi
            if [ -f "$mod/go.sum.bak" ] && ! diff -q "$mod/go.sum" "$mod/go.sum.bak" >/dev/null; then
              echo "::warning::go.sum changed in $mod after go mod tidy"
            fi
            rm -f "$mod/go.mod.bak" "$mod/go.sum.bak"
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint all modules
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in . delimited serialization markup d2 daghtml graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::govulncheck $mod"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done

  duplication:
    name: Code Duplication Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install art-dupl
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.6.2

      - name: Check for harmful code duplication
        run: |
          # Threshold t=4: the production dedup gate per ADR 008.
          # The codebase is documented as clean at t=4 (0 groups).
          # If new duplication appears, this surfaces it as a warning for review.
          RESULT=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 art-dupl -t 4 2>/dev/null | wc -l)
          if [ "$RESULT" -gt 0 ]; then
            echo "::warning::Found $RESULT lines of duplication (t=4). Review needed — see ADR 008 for accepted patterns."
          else
            echo "No harmful duplication detected (t=4 production gate)."
          fi

  workflows:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # actionlint v1.7.12 verified clean on this repo's workflows (2026-10-20).
      # shellcheck checks run too when the runner image ships shellcheck, which
      # is why the module loops quote every "$mod".
      - name: Lint GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
