name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.12
  GOEXPERIMENT: jsonv2

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all modules
        run: |
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Build $mod"
            (cd $mod && go build ./...)
            echo "::endgroup::"
          done

      - name: Test all modules
        run: |
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Test $mod"
            (cd $mod && go test -v -race -timeout 120s -coverprofile=cover.out ./...)
            echo "::endgroup::"
          done

      - name: Check coverage thresholds
        run: |
          MIN_COVERAGE=80
          FAILED=""
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            if [ -f "$mod/cover.out" ]; then
              COV=$(cd $mod && go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
              echo "$mod: ${COV}% coverage"
              if [ "$(echo "$COV < $MIN_COVERAGE" | bc -l)" = "1" ]; then
                FAILED="$FAILED $mod(${COV}%)"
              fi
              rm -f $mod/cover.out
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Coverage below ${MIN_COVERAGE}% in:$FAILED"
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::Mod tidy $mod"
            (cd $mod && cp go.mod go.mod.bak && cp go.sum go.sum.bak 2>/dev/null || true)
            (cd $mod && go mod tidy)
            (cd $mod && diff go.mod go.mod.bak || (echo "go.mod is not tidy in $mod" && exit 1))
            (cd $mod && diff go.sum go.sum.bak 2>/dev/null || true)
            (cd $mod && rm -f go.mod.bak go.sum.bak)
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint all modules
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=5m

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for mod in . delimited serialization markup d2 graph plantuml escape testhelpers testhelpers/graphtest table markdown tree nom tui bdd integration examples; do
            echo "::group::govulncheck $mod"
            (cd $mod && govulncheck ./...)
            echo "::endgroup::"
          done

  duplication:
    name: Code Duplication Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install art-dupl
        run: go install github.com/LarsArtmann/art-dupl/cmd/art-dupl@v0.6.2

      - name: Check for harmful code duplication
        run: |
          # Threshold t=50: only egregious duplication surfaces.
          # See ADR 008 for the dedup workflow and accepted patterns.
          RESULT=$(find . -name '*.go' -not -path './vendor/*' | xargs art-dupl -t 50 2>/dev/null | wc -l)
          if [ "$RESULT" -gt 0 ]; then
            echo "::warning::Found $RESULT lines of high-threshold duplication (t=50). Review needed."
          else
            echo "No harmful duplication detected (t=50 threshold)."
          fi
