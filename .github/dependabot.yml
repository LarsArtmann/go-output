version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(website)"
      include: "scope"
    labels:
      - "dependencies"
      - "website"
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
    ignore:
      # canvaskit-wasm >=0.42 ships an emscripten build that breaks Astro's
      # ESM prerender on /og routes (2026-09-03 outage). Re-widen only after
      # upstream fixes it; see website/README.md.
      - dependency-name: "canvaskit-wasm"
