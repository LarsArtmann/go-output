# Pre-commit hooks for go-output
# See https://pre-commit.com for more information
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml

  - repo: https://github.com/tenacity-team/pre-commit-golang
    rev: v1.0.0
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-mod-tidy

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --fix ./...
        language: system
        pass_filenames: false
        types: [go]

  - repo: local
    hooks:
      - id: go-test
        name: go-test
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]
