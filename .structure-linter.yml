# Skip structural rules that are by design for this multi-module go-output project
skip_rules:
  - replace-directive     # Multi-module workspace requires replace directives
  - root-package-files    # Root package (package output) is the public API
  - pkg-directory         # Root package IS the pkg for this library
  - pkg-errors-structure  # Enum sub-module handles error types
  - coverage-minimum      # Coverage thresholds managed outside this linter
  - coverage-out-location # Coverage files generated by CI
