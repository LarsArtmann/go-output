version: "2"
run:
  timeout: 5m
  go: 1.26.1
  build-tags: []
  allow-parallel-runners: false
  allow-serial-runners: false
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - contextcheck
    - gochecknoglobals
    - unconvert
    - gochecksumtype
    - nolintlint
    - sloglint
    - misspell
    - testifylint
    - recvcheck
    - exhaustive
    - revive
    - zerologlint
    - wastedassign
    - errname
    - nestif
    - exhaustruct
    - gocognit
    - errcheck
    - copyloopvar
    - rowserrcheck
    - cyclop
    - sqlclosecheck
    - reassign
    - ginkgolinter
    - interfacebloat
    - protogetter
    - nilerr
    - bodyclose
    - perfsprint
    - wrapcheck
    - usetesting
    - gosmopolitan
    - govet
    - spancheck
    - musttag
    - nakedret
    - nilnesserr
    - gocyclo
    - ineffassign
    - thelper
    - staticcheck
    - gochecknoinits
    - noctx
    - unparam
    - errchkjson
    - loggercheck
    - durationcheck
    - forcetypeassert
    - gosec
    - goconst
    - dupl
    - nilnil
    - gocritic
    - prealloc
    - predeclared
    - paralleltest
    - mirror
    - maintidx
    - unused
    - funlen
    - intrange
    - errorlint
  settings:
    revive:
      rules:
        - disabled: true
          name: var-naming
  exclusions:
    rules:
      - path: sort/.*\.go
        text: package name
        linters:
          - revive
formatters:
  enable:
    - golines
issues: {}
