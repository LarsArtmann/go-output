version: "2"
run:
  timeout: 5m
  go: 1.26.7
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - clickhouselint
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  disable:
    - depguard
  settings:
    cyclop:
      max-complexity: 12
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    exhaustruct:
      exclude:
        - os/exec.Cmd
    funlen:
      lines: 200
      statements: 100
    ginkgolinter:
      forbid-focus-container: true
      forbid-spec-pollution: true
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-allow-list:
        - github.com/larsartmann/go-output/d2
        - github.com/larsartmann/go-output/delimited
        - github.com/larsartmann/go-output/delimited
      replace-local: true
    gosec:
      excludes:
        - G304
        - G115
    ireturn:
      allow:
        - error
        - empty
        - anon
        - stdlib
        - generic
    makezero:
      always: true
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "100"
    revive:
      rules:
        - disabled: true
          name: var-naming
    testifylint:
      disable:
        - go-require
      enable-all: true
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-output
        - github.com/larsartmann/go-output/*
  exclusions:
    generated: lax
    rules:
      - path: testing_test\.go
        text: package should be
        linters:
          - testpackage
      - path: _test\.go$
        text: package should be
        linters:
          - testpackage
      - path: benchmarks_test\.go
        text: package should be
        linters:
          - testpackage
      - path: fuzz_test\.go
        text: package should be
        linters:
          - testpackage
      - path: render_helpers_test\.go
        text: package should be
        linters:
          - testpackage
      - path: integration/userjourney_test\.go
        text: package should be
        linters:
          - testpackage
      - path: integration/render_tabledata_test\.go
        text: package should be
        linters:
          - testpackage
      - path: internal/
        text: (?:gochecknoglobals)
        linters:
          - gochecknoglobals
      - path: escape/
        text: (?:gochecknoglobals)
        linters:
          - gochecknoglobals
      - path: examples/
        text: (?:forbidigo|magic number|global variable)
        linters:
          - forbidigo
          - mnd
          - gochecknoglobals
      - path: _test\.go$
        text: (?:parallel test|t\.Parallel)
        linters:
          - paralleltest
      - path: _test\.go$
        linters:
          - errcheck
          - forcetypeassert
          - err113
      - path: _test\.go$
        text: (?:G104)
        linters:
          - gosec
      - path: _test\.go$
        text: (?:make it a constant|but such constant)
        linters:
          - goconst
      - path: _test\.go$
        text: (?:parallel test|t\.Parallel|test helper)
        linters:
          - paralleltest
          - thelper
          - tparallel
      - path: internal/
        text: .*
        linters:
          - gochecknoglobals
          - exhaustruct
          - varnamelen
      - path: escape/
        text: .*
        linters:
          - gochecknoglobals
          - exhaustruct
          - varnamelen
      - path: nom/symbols\.go
        text: (?:global variable)
        linters:
          - gochecknoglobals
      - path: nom/
        text: (?:make it a constant|but such constant)
        linters:
          - goconst
      - path: nom/
        text: (?:do not define dynamic errors)
        linters:
          - err113
      - path: nom/timing_cache_persist\.go
        text: (?:G304)
        linters:
          - gosec
      - path: format\.go
        text: (?:gochecknoglobals|AllFormats)
        linters:
          - gochecknoglobals
      - path: format\.go
        text: (?:already exists|make it a constant)
        linters:
          - goconst
      - path: .*\.go$
        text: .*
        linters:
          - godoclint
          - iface
          - inamedparam
          - ireturn
          - funlen
          - forbidigo
          - mnd
          - noinlineerr
          - nlreturn
          - nonamedreturns
          - tagliatelle
          - unparam
          - unused
          - exhaustruct
          - nolintlint
          - paralleltest
          - thelper
          - tparallel
          - varnamelen
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _enum\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/larsartmann/go-output)
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _enum\.go$
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
