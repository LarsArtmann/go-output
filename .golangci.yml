version: "2"
run:
  timeout: 5m
  go: 1.26.3
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
  tests: true
output:
  formats: {}
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        default:
          allow:
            - $STDERR
            - $GITHUB_ACTION
            - bytes
            - cmp
            - encoding/csv
            - encoding/json
            - encoding/xml
            - errors
            - fmt
            - html
            - io
            - maps
            - os
            - slices
            - sort
            - strconv
            - strings
            - sync
            - testing
            - time
            - github.com/larsartmann/go-output
            - github.com/larsartmann/go-output/enum
            - github.com/larsartmann/go-output/envdetect
            - github.com/larsartmann/go-output/internal/gentest
            - github.com/larsartmann/go-output/escape
            - github.com/larsartmann/go-output/table
            - github.com/larsartmann/go-output/testhelpers
            - github.com/larsartmann/go-output/d2
            - github.com/larsartmann/go-output/graph
            - github.com/larsartmann/go-output/delimited
            - github.com/larsartmann/go-output/serialization
            - github.com/larsartmann/go-output/markdown
            - github.com/larsartmann/go-output/markup
            - github.com/larsartmann/go-output/plantuml
            - github.com/larsartmann/go-output/nom
            - github.com/larsartmann/go-output/tui
            - github.com/larsartmann/go-output/examples/shared
            - github.com/larsartmann/go-branded-id
            - charm.land/lipgloss/v2
            - charm.land/lipgloss/v2/table
            - charm.land/bubbletea/v2
            - github.com/go-faster/yaml
            - github.com/pelletier/go-toml/v2
            - bufio
            - cmp
            - context
            - encoding/csv
            - encoding/json
            - encoding/xml
            - errors
            - fmt
            - golang.org/x/term
            - html
            - image/color
            - io
            - os
            - path/filepath
            - slices
            - sort
            - strconv
            - strings
            - sync
            - testing
            - time
            - log
            - github.com/charmbracelet/x/ansi
            - github.com/onsi/ginkgo/v2
            - github.com/onsi/gomega
            - github.com/charmbracelet/x/exp/golden
            - github.com/mattn/go-runewidth
        examples:
          allow:
            - $STDERR
            - $GITHUB_ACTION
            - bytes
            - fmt
            - io
            - os
            - strconv
            - strings
            - github.com/larsartmann/go-output
            - github.com/larsartmann/go-output/examples/shared
            - github.com/larsartmann/go-output/d2
            - github.com/larsartmann/go-output/delimited
            - github.com/larsartmann/go-output/graph
            - github.com/larsartmann/go-output/markdown
            - github.com/larsartmann/go-output/markup
            - github.com/larsartmann/go-output/serialization
            - github.com/larsartmann/go-output/table
            - github.com/larsartmann/go-output/plantuml
            - github.com/larsartmann/go-output/nom
            - github.com/larsartmann/go-output/tui
            - github.com/larsartmann/go-branded-id
          files:
            - examples/**/*.go
        main:
          files:
            - "**/*.go"
            - "!**/*_test.go"
          allow:
            - $STDERR
            - $GITHUB_ACTION
            - github.com/larsartmann/go-output
            - github.com/larsartmann/go-output/enum
            - github.com/larsartmann/go-output/envdetect
            - github.com/larsartmann/go-output/internal/gentest
            - github.com/larsartmann/go-output/escape
            - github.com/larsartmann/go-output/table
            - github.com/larsartmann/go-output/testhelpers
            - github.com/larsartmann/go-output/d2
            - github.com/larsartmann/go-output/graph
            - github.com/larsartmann/go-output/delimited
            - github.com/larsartmann/go-output/serialization
            - github.com/larsartmann/go-output/markdown
            - github.com/larsartmann/go-output/markup
            - github.com/larsartmann/go-output/plantuml
            - github.com/larsartmann/go-output/nom
            - github.com/larsartmann/go-output/tui
            - github.com/larsartmann/go-output/examples/shared
            - github.com/larsartmann/go-branded-id
            - charm.land/lipgloss/v2
            - charm.land/lipgloss/v2/table
            - charm.land/bubbletea/v2
            - github.com/go-faster/yaml
            - github.com/pelletier/go-toml/v2
            - bufio
            - cmp
            - context
            - encoding/csv
            - encoding/json
            - encoding/xml
            - errors
            - fmt
            - golang.org/x/term
            - html
            - image/color
            - io
            - maps
            - os
            - path/filepath
            - slices
            - sort
            - strconv
            - strings
            - sync
            - testing
            - time
            - log
            - github.com/charmbracelet/x/ansi
    exhaustruct:
      exclude:
        - os/exec.Cmd
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-allow-list:
        - github.com/larsartmann/go-output/d2
        - github.com/larsartmann/go-output/delimited
        - github.com/larsartmann/go-output/enum
        - github.com/larsartmann/go-output/escape
        - github.com/larsartmann/go-output/graph
        - github.com/larsartmann/go-output/markdown
        - github.com/larsartmann/go-output/markup
        - github.com/larsartmann/go-output/serialization
        - github.com/larsartmann/go-output/table
        - github.com/larsartmann/go-output/testhelpers
        - github.com/larsartmann/go-output/plantuml
        - github.com/larsartmann/go-output/nom
        - github.com/larsartmann/go-output/tui
      replace-local: true
    revive:
      rules:
        - disabled: true
          name: var-naming
    varnamelen:
      ignore-map-index-ok: true
      ignore-names:
        - err
        - ok
        - tt
        - fn
        - t
        - i
        - m
        - g
        - a
        - b
        - v
      ignore-type-assert-ok: true
    wrapcheck:
      ignore-package-globs:
        - github.com/larsartmann/go-output
        - github.com/larsartmann/go-output/*
  exclusions:
    generated: lax
    rules:
      - path: testing_test\.go
        text: package should be
        linters:
          - testpackage
      - path: _test\.go$
        text: package should be
        linters:
          - testpackage
      - path: benchmarks_test\.go
        text: package should be
        linters:
          - testpackage
      - path: fuzz_test\.go
        text: package should be
        linters:
          - testpackage
      - path: render_helpers_test\.go
        text: package should be
        linters:
          - testpackage
      - path: userjourney_test\.go
        text: package should be
        linters:
          - testpackage
      - path: userjourney_test\.go
        linters:
          - depguard
      - path: integration/
        text: package should be
        linters:
          - testpackage
      - path: enum/enum_test\.go
        text: package should be
        linters:
          - testpackage
      - path: enum/testing_test\.go
        text: package should be
        linters:
          - testpackage
      - path: internal/
        text: (?:gochecknoglobals)
        linters:
          - gochecknoglobals
      - path: escape/
        text: (?:gochecknoglobals)
        linters:
          - gochecknoglobals
      - path: examples/
        text: (?:forbidigo|magic number|global variable)
        linters:
          - forbidigo
          - mnd
          - gochecknoglobals
      - path: _test\.go$
        text: (?:parallel test|t\.Parallel)
        linters:
          - paralleltest
      - path: _test\.go$
        linters:
          - errcheck
          - forcetypeassert
          - err113
      - path: _test\.go$
        text: (?:G104)
        linters:
          - gosec
      - path: _test\.go$
        text: (?:make it a constant|but such constant)
        linters:
          - goconst
      - path: _test\.go$
        text: (?:parallel test|t\.Parallel|test helper)
        linters:
          - paralleltest
          - thelper
          - tparallel
      - path: internal/
        text: .*
        linters:
          - gochecknoglobals
          - exhaustruct
          - varnamelen
      - path: escape/
        text: .*
        linters:
          - gochecknoglobals
          - exhaustruct
          - varnamelen
      - path: nom/symbols\.go
        text: (?:global variable)
        linters:
          - gochecknoglobals
      - path: nom/
        text: (?:make it a constant|but such constant)
        linters:
          - goconst
      - path: nom/
        text: (?:do not define dynamic errors)
        linters:
          - err113
      - path: nom/timing_cache_persist\.go
        text: (?:G304)
        linters:
          - gosec
      - path: format\.go
        text: (?:gochecknoglobals|AllFormats)
        linters:
          - gochecknoglobals
      - path: envdetect/envdetect\.go
        text: (?:gochecknoglobals|CIEnvVars)
        linters:
          - gochecknoglobals
      - path: format\.go
        text: (?:already exists|make it a constant)
        linters:
          - goconst
      - path: .*\.go$
        text: .*
        linters:
          - godoclint
          - iface
          - inamedparam
          - ireturn
          - funlen
          - forbidigo
          - mnd
          - noinlineerr
          - nlreturn
          - nonamedreturns
          - tagliatelle
          - unparam
          - unused
          - exhaustruct
          - nolintlint
          - paralleltest
          - thelper
          - tparallel
          - varnamelen
      - path: _test\.go
        linters:
          - exhaustruct
          - testpackage
          - gochecknoglobals
          - funlen
          - cyclop
          - goconst
      - path: _test\.go
        text: unused
        linters:
          - unused
    paths:
      - \.gen\.go$
      - _enum\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - Standard
        - Default
        - Prefix(github.com/larsartmann/go-output)
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - _enum\.go$
      - _templ\.go$
issues: {}
